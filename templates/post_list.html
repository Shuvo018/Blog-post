<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><a href="{% url 'post_create' %}">create post</a></h1>
    {% for post in post_list %}
    <div>
        <h1>{{ post.title }}</h1>
        <h4>{{ post.content }}</h4>
    </div>
    {% empty %}
    <h4>No posts found.</h4>
    {% endfor %}
    
</body>
</html>
