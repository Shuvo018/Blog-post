{% if comment.child_comment.all %}
<div class="reply-list">
    <h1>This is reply: </h1>
    {% for reply in comment.child_comment.all %}
    <div class="reply-item">
        <p>{{ reply.user.username }}</p>
        <h3>{{ reply.content }}</h3>
        <a href="{% url 'comment_reply' reply.id %}">reply</a>
    </div>
    {% with comment=reply %}
        {% include 'comment_reply_node.html'%}
    {% endwith %}
{% endfor %}
</div>
{% endif %}
