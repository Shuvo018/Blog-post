{% if comment.child_comment.all %}
<!-- Nested Replies -->
{% for reply in comment.child_comment.all %}
    <div class="reply-item" style="margin-left: 2rem; margin-top: 1rem;">
        <div class="comment-meta">
            <span class="comment-author">
                <i class="bi bi-person-circle"></i>
                {{ reply.user_comment.username }}
            </span>
            <span class="comment-time">
                {{ reply.created_at|timesince }} ago
            </span>
        </div>
        <div class="comment-content">
            {{ reply.content }}
        </div>
        <a href="{% url 'comment_reply' reply.id %}" class="btn-link btn-sm">
            <i class="bi bi-reply"></i> Reply
        </a>

        <!-- Recursive nested replies -->
        {% with comment=reply %}
            {% include 'comment_reply_node.html' %}
        {% endwith %}
    </div>
{% endfor %}
{% endif %}
